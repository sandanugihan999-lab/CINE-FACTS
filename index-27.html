<!doctype html>
<html lang="si">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINE FACTS LK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Noto+Sans+Sinhala:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js"></script>
  <style>
  :root{
    --bg: #0a0a0a;
    --surface: #161513;
    --surface-hi: #201e1a;
    --red: #d4a418;
    --gold: #f2b705;
    --gold-deep: #c98f02;
    --text: #f2efe9;
    --muted: #948d7d;
    --sprocket: #2b2820;
  }
  html[data-theme="light"]{
    --bg:#f5f3ef;
    --surface:#ffffff;
    --surface-hi:#eeeae2;
    --text:#171512;
    --muted:#6b665c;
    --sprocket:#ddd6c9;
  }
  html[data-theme="light"] header{
    background:linear-gradient(180deg, #ffffff 0%, #f7f5f1 100%);
    border-bottom-color:#e2ded4;
  }
  html[data-theme="light"] #searchInput{ border-color:#ddd6c9; }
  html[data-theme="light"] .card{ border-color:#e2ded4; }
  html[data-theme="light"] .filmstrip{ background-color:#e2ded4; }
  html[data-theme="light"] .modal-backdrop{ background:rgba(245,243,239,.92); }
  html[data-theme="light"] .close-btn{ border-color:#ddd6c9; }
  html[data-theme="light"] .genre-chip{ border-color:#ddd6c9; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans Sinhala','Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{ background:var(--red); color:#fff; }

  /* film strip texture bar */
  .filmstrip{
    height:14px;
    width:100%;
    background:
      repeating-linear-gradient(90deg, var(--sprocket) 0 10px, transparent 10px 22px);
    background-color:#000;
    opacity:.9;
  }

  header{
    background:linear-gradient(180deg, #100e13 0%, #0b0a0d 100%);
    border-bottom:1px solid #221f27;
    position:sticky;
    top:0;
    z-index:50;
  }
  .header-inner{
    max-width:1200px;
    margin:0 auto;
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }
  .logo{
    display:flex;
    align-items:center;
    text-decoration:none;
    flex-shrink:0;
  }
  .logo-img{
    height:50px;
    width:50px;
    border-radius:50%;
    object-fit:cover;
  }
  .search-wrap{
    flex:1;
    min-width:200px;
    position:relative;
  }
  #searchInput{
    width:100%;
    background:var(--surface);
    border:1px solid #2c2932;
    color:var(--text);
    padding:11px 16px 11px 40px;
    border-radius:8px;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s;
  }
  #searchInput:focus{ border-color:var(--red); }
  #searchInput::placeholder{ color:var(--muted); }
  .search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    opacity:.6;
    pointer-events:none;
  }
  .yt-link{
    background:var(--red);
    color:#fff;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
    transition:filter .15s;
  }
  .yt-link:hover{ filter:brightness(1.12); }
  .theme-toggle{
    background:var(--surface-hi);
    border:1px solid #2c2932;
    color:var(--text);
    width:40px; height:40px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    flex-shrink:0;
    transition:filter .15s;
  }
  .theme-toggle:hover{ filter:brightness(1.15); }

  .bear-counter{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface-hi);
    border:1px solid #2c2932;
    padding:6px 14px;
    border-radius:20px;
    flex-shrink:0;
    cursor:default;
    user-select:none;
  }
  .bear-emoji{
    display:inline-block;
    font-size:20px;
    line-height:1;
  }
  .bear-counter.grew{ transform:scale(1.08); }
  .bear-counter{ transition:transform .25s; }
  .bear-count{
    color:var(--gold);
    font-weight:700;
    font-size:13.5px;
    white-space:nowrap;
  }
  .bear-label{
    color:var(--muted);
    font-size:11px;
    font-weight:600;
  }

  #bear3dStage{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    height:150px;
    z-index:40;
    pointer-events:none;
    overflow:hidden;
  }
  #bear3dStage canvas{
    pointer-events:auto;
    cursor:grab;
    display:block;
  }
  #bear3dStage canvas:active{ cursor:grabbing; }
  @media (max-width:600px){
    #bear3dStage{ height:110px; }
  }

  /* hero banner */
  .hero{
    position:relative;
    width:100%;
    aspect-ratio:16/7;
    max-height:520px;
    overflow:hidden;
    background:#000;
  }
  .hero-slide{
    position:absolute; inset:0;
    opacity:0;
    transition:opacity .7s ease;
    pointer-events:none;
  }
  .hero-slide.active{ opacity:1; pointer-events:auto; }
  .hero-dots{
    position:absolute;
    z-index:3;
    bottom:16px;
    right:20px;
    display:flex;
    gap:8px;
  }
  .hero-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    cursor:pointer;
    transition:background .2s, width .2s;
    border:none;
    padding:0;
  }
  .hero-dot.active{ background:var(--gold); width:22px; border-radius:5px; }
  .hero img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    filter:brightness(.85);
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(10,10,10,0) 40%, var(--bg) 100%),
      linear-gradient(90deg, rgba(10,10,10,.95) 0%, rgba(10,10,10,.15) 55%, rgba(10,10,10,.05) 100%);
  }
  .hero-content{
    position:absolute;
    left:0; bottom:0;
    padding:0 20px 34px;
    max-width:640px;
    z-index:2;
  }
  .hero-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--gold);
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:2px;
    font-size:14px;
    margin-bottom:10px;
    text-shadow:0 0 14px rgba(242,183,5,.5);
  }
  .hero-title{
    font-size:34px;
    font-weight:700;
    line-height:1.15;
    margin:0 0 14px;
    text-shadow:0 3px 18px rgba(0,0,0,.6);
  }
  .hero-actions{ display:flex; gap:12px; flex-wrap:wrap; }
  .hero-play{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--gold);
    color:#161513;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    font-weight:700;
    font-size:14.5px;
    font-family:inherit;
    cursor:pointer;
    box-shadow:0 4px 20px rgba(242,183,5,.28);
    transition:transform .15s, box-shadow .15s;
  }
  .hero-play:hover{ transform:translateY(-2px); box-shadow:0 6px 26px rgba(242,183,5,.4); }
  .hero-play svg{ width:18px; height:18px; }
  .hero-more{
    display:inline-flex;
    align-items:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(6px);
    color:var(--text);
    border:1px solid rgba(255,255,255,.18);
    padding:12px 22px;
    border-radius:8px;
    font-weight:600;
    font-size:14.5px;
    text-decoration:none;
    transition:background .15s;
  }
  .hero-more:hover{ background:rgba(255,255,255,.15); }

  main{ max-width:1200px; margin:0 auto; padding:34px 20px 60px; }

  .page-title{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:21px;
    font-weight:700;
    margin:4px 0 24px;
    color:var(--text);
  }
  .page-title::before{
    content:'';
    width:5px;
    height:22px;
    background:var(--gold);
    border-radius:3px;
    box-shadow:0 0 10px rgba(242,183,5,.6);
  }
  .page-title span{ color:var(--muted); font-weight:500; font-size:15px; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:18px;
  }

  .genre-filter{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:8px;
    margin:0 0 26px;
  }
  .genre-filter::-webkit-scrollbar{ height:5px; }
  .genre-chip{
    background:var(--surface);
    border:1px solid #2c2932;
    color:var(--muted);
    padding:8px 16px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    transition:background .15s, color .15s, border-color .15s;
  }
  .genre-chip.active, .genre-chip:hover{
    background:var(--gold);
    color:#161513;
    border-color:var(--gold);
  }

  .category-row{ margin-bottom:32px; }
  .category-row-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:17px;
    font-weight:700;
    margin:0 0 14px;
    color:var(--text);
  }
  .category-row-title::before{
    content:'';
    width:4px;
    height:18px;
    background:var(--gold);
    border-radius:3px;
    box-shadow:0 0 10px rgba(242,183,5,.6);
  }
  .row-scroll{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:8px;
    scroll-snap-type:x proximity;
  }
  .row-scroll::-webkit-scrollbar{ height:5px; }
  .row-scroll::-webkit-scrollbar-thumb{ background:var(--surface-hi); border-radius:3px; }
  .row-scroll .card{ flex:0 0 150px; scroll-snap-align:start; }
  @media (max-width:520px){
    .row-scroll .card{ flex:0 0 122px; }
  }

  .card{
    background:var(--surface);
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    border:1px solid #201d24;
    touch-action:manipulation;
    -webkit-tap-highlight-color:rgba(242,183,5,.25);
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s;
  }
  .card:hover{
    transform:translateY(-6px) scale(1.015);
    border-color:var(--gold);
    box-shadow:0 14px 34px rgba(0,0,0,.5), 0 0 0 1px rgba(242,183,5,.15);
  }
  .thumb-wrap{
    position:relative;
    aspect-ratio:2/3;
    background:#000;
    overflow:hidden;
  }
  .thumb-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .badge-ep{
    position:absolute;
    top:8px;
    left:8px;
    background:var(--gold);
    color:#1a1710;
    font-family:'Bebas Neue',sans-serif;
    font-size:13px;
    letter-spacing:.5px;
    padding:3px 9px;
    border-radius:5px;
    box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  .play-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0);
    opacity:0;
    transition:opacity .2s, background .2s;
  }
  .card:hover .play-overlay{
    opacity:1;
    background:rgba(8,7,5,.45);
  }
  .play-overlay .play-circle{
    width:48px; height:48px;
    border-radius:50%;
    background:var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 24px rgba(242,183,5,.65);
    transform:scale(.85);
    transition:transform .2s;
  }
  .card:hover .play-circle{ transform:scale(1); }
  .play-overlay svg{ width:20px; height:20px; margin-left:2px; }

  .card-info{ padding:10px 11px 13px; }
  .card-title{
    font-size:13.5px;
    font-weight:600;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:2.6em;
  }
  .card-meta{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:7px;
    color:var(--gold);
    font-size:12px;
    font-weight:600;
  }
  .card-meta svg{ width:12px; height:12px; }

  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--muted);
  }
  .empty-state .big{
    font-family:'Bebas Neue',sans-serif;
    font-size:28px;
    color:var(--text);
    margin-bottom:8px;
    letter-spacing:1px;
  }

  /* modal player */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(4,3,5,.88);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:200;
    padding:20px;
    overflow-y:auto;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-box{
    width:100%;
    max-width:900px;
  }
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .modal-title{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    padding-right:10px;
  }
  .close-btn{
    background:var(--surface-hi);
    border:1px solid #2c2932;
    color:var(--text);
    width:34px;
    height:34px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
    line-height:1;
    flex-shrink:0;
  }
  .close-btn:hover{ background:var(--red); border-color:var(--red); }
  .player-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--sprocket);
  }
  .player-wrap iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
  }
  .player-wrap:fullscreen{
    aspect-ratio:auto;
    width:100vw; height:100vh;
    border-radius:0;
  }
  .player-wrap:-webkit-full-screen{
    width:100vw; height:100vh;
  }

  .video-container{
    position:relative;
    width:100%;
    background:#000;
    border-radius:8px;
    overflow:hidden;
  }
  .video-container video{
    width:100%;
    height:auto;
    display:block;
  }
  .video-container::-webkit-media-controls-panel{
    background-color:#000 !important;
  }
  /* Custom play button overlay */
  .video-container::before{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.3);
    opacity:0;
    transition:opacity 0.3s;
    pointer-events:none;
  }
  .video-container:hover::before{
    opacity:1;
  }

  footer{
    text-align:center;
    padding:24px 20px 34px;
    color:var(--muted);
    font-size:12.5px;
    border-top:1px solid #201d24;
  }

  /* series detail page (inside modal) */
  .series-detail{
    display:flex;
    gap:18px;
    padding-bottom:20px;
    margin-bottom:16px;
    border-bottom:1px solid #201d24;
  }
  .series-poster{
    width:120px;
    flex-shrink:0;
    aspect-ratio:2/3;
    object-fit:cover;
    border-radius:8px;
    background:#000;
    border:1px solid #2c2932;
  }
  .series-info{ display:flex; flex-direction:column; justify-content:center; min-width:0; }
  .series-info h2{
    font-size:20px;
    margin:0 0 8px;
    color:var(--text);
    line-height:1.25;
  }
  .series-meta-line{
    color:var(--gold);
    font-size:13px;
    font-weight:600;
    margin-bottom:14px;
  }
  .series-watch-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--gold);
    color:#161513;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    font-weight:700;
    font-size:13.5px;
    font-family:inherit;
    cursor:pointer;
    width:fit-content;
  }
  .series-watch-btn svg{ width:15px; height:15px; }

  .episode-list{ display:flex; flex-direction:column; gap:2px; }
  .ep-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 6px;
    border-radius:8px;
    cursor:pointer;
    border-bottom:1px solid #201d24;
    transition:background .15s;
  }
  .ep-row:hover{ background:var(--surface-hi); }
  .ep-num{
    width:22px;
    flex-shrink:0;
    text-align:center;
    color:var(--muted);
    font-weight:700;
    font-size:14px;
  }
  .ep-thumb{
    width:64px;
    aspect-ratio:16/9;
    flex-shrink:0;
    border-radius:6px;
    overflow:hidden;
    background:#000;
  }
  .ep-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ep-row-info{ min-width:0; flex:1; }
  .ep-row-title{
    font-size:13.5px;
    font-weight:600;
    color:var(--text);
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .ep-row-tag{ font-size:11.5px; color:var(--gold); margin-top:3px; font-weight:600; }
  .ep-row-play{ flex-shrink:0; color:var(--gold); opacity:.7; }
  .ep-row-play svg{ width:18px; height:18px; }

  @media (max-width:520px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:12px; }
    .card-title{ font-size:12.5px; }
    .hero{ aspect-ratio:4/3; max-height:340px; }
    .hero-title{ font-size:24px; }
    .hero-content{ padding:0 16px 26px; }
    .hero-play, .hero-more{ padding:10px 16px; font-size:13px; }
  }

  /* AI Film Bot widget */
  .ai-chat-btn{
    position:fixed; right:20px; bottom:170px; z-index:60;
    width:56px; height:56px; border-radius:50%;
    background:var(--gold); color:#1a1710; border:none;
    font-size:24px; cursor:pointer; box-shadow:0 4px 18px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center;
    transition:transform .2s;
  }
  .ai-chat-btn:hover{ transform:scale(1.08); }
  @media (max-width:600px){ .ai-chat-btn{ bottom:130px; } }
  .ai-chat-panel{
    position:fixed; right:20px; bottom:236px; z-index:60;
    width:340px; max-width:92vw; height:460px; max-height:70vh;
    background:var(--surface); border:1px solid #2c2932; border-radius:14px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    opacity:0; pointer-events:none; transform:translateY(12px);
    transition:opacity .2s, transform .2s;
  }
  @media (max-width:600px){ .ai-chat-panel{ bottom:196px; } }
  .ai-chat-panel.open{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .ai-chat-head{
    background:linear-gradient(180deg,#100e13,#0b0a0d); color:var(--gold);
    padding:12px 14px; font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid #221f27; flex-shrink:0;
  }
  .ai-chat-close{ background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; }
  .ai-chat-messages{ flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .ai-msg{ max-width:85%; padding:9px 12px; border-radius:10px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; }
  .ai-msg.user{ align-self:flex-end; background:var(--gold); color:#1a1710; border-bottom-right-radius:2px; }
  .ai-msg.bot{ align-self:flex-start; background:var(--surface-hi); color:var(--text); border-bottom-left-radius:2px; }
  .ai-msg.typing{ opacity:.6; font-style:italic; }
  .ai-rec-chip{
    display:inline-block; margin:4px 6px 0 0; padding:5px 10px; font-size:12px;
    background:var(--gold); color:#1a1710; border-radius:14px; cursor:pointer; font-weight:600;
  }
  .ai-chat-input-row{ display:flex; gap:8px; padding:10px; border-top:1px solid #2c2932; flex-shrink:0; }
  .ai-chat-input-row input{
    flex:1; background:var(--bg); border:1px solid #2c2932; color:var(--text);
    padding:9px 12px; border-radius:8px; font-size:13.5px; outline:none; font-family:inherit;
  }
  .ai-chat-input-row input:focus{ border-color:var(--red); }
  .ai-chat-input-row button{
    background:var(--gold); color:#1a1710; border:none; width:38px; border-radius:8px; cursor:pointer; font-size:15px;
  }

  /* 70 subs banner popup */
  .promo-overlay{
    position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.78);
    display:flex; align-items:center; justify-content:center; padding:16px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .promo-overlay.open{ opacity:1; pointer-events:auto; }
  .promo-box{
    position:relative; max-width:420px; width:100%; max-height:88vh;
    border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6);
    transform:scale(.94); transition:transform .25s;
  }
  .promo-overlay.open .promo-box{ transform:scale(1); }
  .promo-box img{ display:block; width:100%; height:auto; max-height:88vh; object-fit:contain; background:#0b0a0d; }
  .promo-close{
    position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%;
    background:rgba(0,0,0,.65); color:#fff; border:1px solid rgba(255,255,255,.3);
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
</style>

let currentGenre = 'all';

function groupBySeries(list){
  const map = new Map();
  list.forEach(v => {
    const key = v.series || v.title;
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(v);
  });
  return Array.from(map, ([series, episodes]) => ({ series, episodes }));
}

let heroTimer = null;
let heroIndex = 0;
let heroGroups = [];

function heroSlideHtml(group){
  const poster = group.episodes[0];
  const src = poster.thumb ? poster.thumb : `https://img.youtube.com/vi/${poster.id}/maxresdefault.jpg`;
  return `
    <img src="${src}" alt="${group.series}">
    <div class="hero-content">
      <div class="hero-eyebrow">★ ★ ★ FEATURED SERIES</div>
      <h1 class="hero-title">${group.series}</h1>
      <div class="hero-actions">
        <button class="hero-play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          දැන් බලන්න
        </button>
        <a href="#videoGrid" class="hero-more">සියලු Episodes</a>
      </div>
    </div>
  `;
}

function goToHeroSlide(i){
  const slides = heroSection.querySelectorAll('.hero-slide');
  const dots = heroDots.querySelectorAll('.hero-dot');
  slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
  dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
  heroIndex = i;
}

function startHeroAutoplay(){
  if(heroTimer) clearInterval(heroTimer);
  if(heroGroups.length < 2) return;
  heroTimer = setInterval(() => {
    goToHeroSlide((heroIndex + 1) % heroGroups.length);
  }, 5500);
}

function buildHeroSlider(groups){
  heroGroups = groups;
  heroSection.querySelectorAll('.hero-slide').forEach(s => s.remove());
  heroDots.innerHTML = '';

  groups.forEach((group, i) => {
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
    slide.innerHTML = heroSlideHtml(group);
    slide.querySelector('.hero-play').addEventListener('click', () => openPlayer(group.episodes[0]));
    slide.querySelector('.hero-more').addEventListener('click', (e) => {
      e.preventDefault();
      openSeries(group);
    });
    heroSection.insertBefore(slide, heroDots);

    const dot = document.createElement('button');
    dot.className = 'hero-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => { goToHeroSlide(i); startHeroAutoplay(); });
    heroDots.appendChild(dot);
  });

  startHeroAutoplay();
}

function playIcon(){
  return `<svg viewBox="0 0 24 24" fill="#1a1710"><path d="M8 5v14l11-7z"/></svg>`;
}

function seriesCardInnerHtml(group){
  const poster = group.episodes[0];
  return `
    <div class="thumb-wrap">
      <img src="${poster.thumb ? poster.thumb : 'https://img.youtube.com/vi/' + poster.id + '/hqdefault.jpg'}" alt="${group.series}" loading="lazy">

function createSeriesCardEl(group){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = seriesCardInnerHtml(group);
  card.addEventListener('click', () => openSeries(group));
  return card;
}

// Main grid: one card per film/series. Search: flat episode matches.
function render(list, searching){
  grid.innerHTML = '';
  if(list.length === 0){
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  if(searching){
    list.forEach(v => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = episodeCardHtml(v);
      card.addEventListener('click', () => openPlayer(v));
      grid.appendChild(card);
    });
    return;
  }

  groupBySeries(list).forEach(group => {
    grid.appendChild(createSeriesCardEl(group));
  });
}

function buildRow(title, groups){
  const section = document.createElement('div');
  section.className = 'category-row';
  const h = document.createElement('p');
  h.className = 'category-row-title';
  h.textContent = title;
  section.appendChild(h);
  const scroll = document.createElement('div');
  scroll.className = 'row-scroll';
  groups.forEach(group => scroll.appendChild(createSeriesCardEl(group)));
  section.appendChild(scroll);
  return section;
}

function buildRows(){
  rowsContainer.innerHTML = '';
  const allGroups = groupBySeries(videos);
  if(allGroups.length === 0) return;

  const recent = allGroups.slice(-8).reverse();
  rowsContainer.appendChild(buildRow('අලුතින් එකතු කළ', recent));

  const genreOrder = [];
  allGroups.forEach(g => {
    const genre = g.episodes[0].genre || 'වෙනත්';
    if(!genreOrder.includes(genre)) genreOrder.push(genre);
  });
  genreOrder.forEach(genre => {
    const groups = allGroups.filter(g => (g.episodes[0].genre || 'වෙනත්') === genre);
    rowsContainer.appendChild(buildRow(genre, groups));
  });
}

function buildGenreFilter(){
  const genres = ['සියල්ල'];
  const seen = new Set();
  groupBySeries(videos).forEach(g => {
    const genre = g.episodes[0].genre || 'වෙනත්';
    if(!seen.has(genre)){ seen.add(genre); genres.push(genre); }
  });
  genreFilter.innerHTML = '';
  genres.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'genre-chip' + (g === 'සියල්ල' ? ' active' : '');
    btn.textContent = g;
    btn.addEventListener('click', () => {
      genreFilter.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      currentGenre = g === 'සියල්ල' ? 'all' : g;
      applyView();
    });
    genreFilter.appendChild(btn);
  });
}

function applyView(){
  const q = searchInput.value.trim().toLowerCase();
  if(q){
    rowsContainer.style.display = 'none';
    gridView.style.display = 'block';
    gridPageTitle.innerHTML = 'සෙවුම් ප්‍රතිඵල <span>— CINE FACTS LK</span>';
    const filtered = videos.filter(v => v.title.toLowerCase().includes(q) || (v.series || '').toLowerCase().includes(q));
    render(filtered, true);
    return;
  }
  if(currentGenre === 'all'){
    rowsContainer.style.display = 'block';
    gridView.style.display = 'none';
  } else {
    rowsContainer.style.display = 'none';
    gridView.style.display = 'block';
    gridPageTitle.innerHTML = `${currentGenre} <span>— CINE FACTS LK</span>`;
    const filtered = videos.filter(v => (v.genre || 'වෙනත්') === currentGenre);
    render(filtered, false);
  }
}

function openSeries(group){
  seriesModalTitle.textContent = '';
  const poster = group.episodes[0];
  const posterSrc = poster.thumb ? poster.thumb : `https://img.youtube.com/vi/${poster.id}/hqdefault.jpg`;

  // Check if series is coming soon
  if(poster.id === 'coming-soon'){
    seriesEpisodeGrid.innerHTML = `
      <div class="series-detail">
        <img class="series-poster" src="${posterSrc}" alt="${group.series}">
        <div class="series-info">
          <h2>${group.series}</h2>
          <div class="series-meta-line">CINE FACTS LK</div>
          <button class="series-watch-btn" disabled style="background:#555; cursor:not-allowed; opacity:0.6;">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Coming Soon 🔜
          </button>
          <p style="color:#aaa; font-size:12px; margin-top:16px; line-height:1.5;">නවතම episodes ඉතින්ම එනවා. පහසුවෙන්ම බලා ගන්න!</p>
        </div>
      </div>
    `;
  } else {
    const rowsHtml = group.episodes.map((v, i) => `
      <div class="ep-row" data-idx="${i}">
        <div class="ep-num">${i + 1}</div>
        <div class="ep-thumb"><img src="${v.thumb ? v.thumb : 'https://img.youtube.com/vi/' + v.id + '/hqdefault.jpg'}" alt="${v.title}" loading="lazy"></div>
        <div class="ep-row-info">
          <div class="ep-row-title">${v.title}</div>
          ${v.ep ? `<div class="ep-row-tag">${v.ep}</div>` : ''}
        </div>
        <div class="ep-row-play">${playIcon().replace('#1a1710', 'currentColor')}</div>
      </div>
    `).join('');

    seriesEpisodeGrid.innerHTML = `
      <div class="series-detail">
        <img class="series-poster" src="${posterSrc}" alt="${group.series}">
        <div class="series-info">
          <h2>${group.series}</h2>
          <div class="series-meta-line">CINE FACTS LK &nbsp;•&nbsp; ${group.episodes.length} Episodes</div>
          <button class="series-watch-btn" id="seriesWatchBtn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            Episode 1 බලන්න
          </button>
        </div>
      </div>
      <div class="episode-list">${rowsHtml}</div>
    `;

    document.getElementById('seriesWatchBtn').addEventListener('click', () => openPlayer(group.episodes[0]));
    seriesEpisodeGrid.querySelectorAll('.ep-row').forEach(row => {
      row.addEventListener('click', () => openPlayer(group.episodes[+row.dataset.idx]));
    });
  }

  seriesModalBackdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSeries(){
  seriesModalBackdrop.classList.remove('open');
  document.body.style.overflow = '';
}

/* -------- Growing Bear watch counter --------
   සෑම වතාවක්ම කෙනෙක් video එකක් play කරද්දී 🐻 icon එක
   ටිකෙන් ටික loku වෙනවා, site එකේ මුළු නැරඹුම් ගණන අනුව. */
const BEAR_KEY = 'cinefacts-watch-count';
const bearCounterEl = document.getElementById('bearCounter');
const bearEmojiEl = document.getElementById('bearEmoji');
const bearCountEl = document.getElementById('bearCount');

function getWatchCount(){
  try{ return parseInt(localStorage.getItem(BEAR_KEY) || '0', 10) || 0; }
  catch(e){ return 0; }
}
function setWatchCount(n){
  try{ localStorage.setItem(BEAR_KEY, String(n)); }catch(e){}
}
function bearSizeForCount(n){
  // 24px starting size, grows with every watch, caps out at 72px
  return Math.min(24 + n * 1.5, 72);
}
function updateBearDisplay(animate){
  const n = getWatchCount();
  bearCountEl.textContent = n;
  bearEmojiEl.style.fontSize = bearSizeForCount(n) + 'px';
  if(animate){
    bearCounterEl.classList.add('grew');
    setTimeout(() => bearCounterEl.classList.remove('grew'), 350);
  }
}
function registerWatch(){
  setWatchCount(getWatchCount() + 1);
  updateBearDisplay(true);
  if(typeof updateBear3DScale === 'function') updateBear3DScale();
}
updateBearDisplay(false);

function openPlayer(v){
  registerWatch();
  modalTitle.textContent = v.title;
  const playerWrap = document.getElementById('playerWrap');
  
  let fileId = null;
  
  if(v.id.includes('drive.google.com')){
    // Extract file ID from Google Drive URL
    fileId = v.id.match(/\/d\/([a-zA-Z0-9-_]+)/)?.[1];
  } else if(v.id.match(/^[a-zA-Z0-9-_]{20,}$/)){
    // Direct file ID
    fileId = v.id;
  } else {
    // YouTube format
    fileId = null;
  }
  
  if(fileId){
    // Google Drive video streaming via Drive's own preview embed
    playerWrap.innerHTML = `
      <iframe
        src="https://drive.google.com/file/d/${fileId}/preview"
        width="100%" height="100%"
        style="border:none;"
        allow="autoplay; fullscreen; encrypted-media"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true">
      </iframe>
    `;
  } else {
    // YouTube format
    playerWrap.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border:none;"></iframe>`;
  }
  
  modalBackdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePlayer(){
  modalBackdrop.classList.remove('open');
  const playerWrap = document.getElementById('playerWrap');
  playerWrap.innerHTML = '<iframe id="playerFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  document.body.style.overflow = '';
}

const fullscreenBtn = document.getElementById('fullscreenBtn');
fullscreenBtn.addEventListener('click', () => {
  const el = document.getElementById('playerWrap');
  if(el.requestFullscreen) el.requestFullscreen();
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if(el.webkitEnterFullscreen) el.webkitEnterFullscreen();
  else if(el.mozRequestFullScreen) el.mozRequestFullScreen();
  else if(el.msRequestFullscreen) el.msRequestFullscreen();
});

closeBtn.addEventListener('click', closePlayer);
modalBackdrop.addEventListener('click', (e) => {
  if(e.target === modalBackdrop) closePlayer();
});
seriesCloseBtn.addEventListener('click', closeSeries);
seriesModalBackdrop.addEventListener('click', (e) => {
  if(e.target === seriesModalBackdrop) closeSeries();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){ closePlayer(); closeSeries(); }
});

searchInput.addEventListener('input', applyView);

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeToggle.textContent = t === 'light' ? '☀️' : '🌙';
  try{ localStorage.setItem('cinefacts-theme', t); }catch(e){}
}
let savedTheme = 'dark';
try{ savedTheme = localStorage.getItem('cinefacts-theme') || 'dark'; }catch(e){}
applyTheme(savedTheme);
themeToggle.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'light' ? 'dark' : 'light');
});

/* ================================================================
   3D BEAR — site එක තුළ ඇවිදින, watch count එකට අනුව loku වෙන,
   click+drag කරලා rotate කරන්න පුළුවන් Three.js bear කෙනා.
   ================================================================ */
(function initBear3D(){
  if(typeof THREE === 'undefined') return;
  const stage = document.getElementById('bear3dStage');
  if(!stage) return;

  let W = stage.clientWidth, H = stage.clientHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
  camera.position.set(0, 2.6, 9);
  camera.lookAt(0, 1, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const dirLight = new THREE.DirectionalLight(0xfff2cf, 0.9);
  dirLight.position.set(4, 6, 5);
  scene.add(dirLight);
  const rimLight = new THREE.DirectionalLight(0xf2b705, 0.35);
  rimLight.position.set(-5, 3, -4);
  scene.add(rimLight);

  const furMat = new THREE.MeshStandardMaterial({ color: 0x7a4a25, roughness: 0.85, metalness: 0.05 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x2e1c12, roughness: 0.85 });
  const noseMat = new THREE.MeshStandardMaterial({ color: 0x1a1210, roughness: 0.6 });

  function buildBear(){
    const bear = new THREE.Group();

    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 16), furMat);
    body.scale.set(1.25, 0.95, 1);
    body.position.set(0, 1.05, 0);
    bear.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.58, 18, 16), furMat);
    head.position.set(1.35, 1.45, 0);
    bear.add(head);

    const snout = new THREE.Mesh(new THREE.SphereGeometry(0.27, 14, 12), darkMat);
    snout.scale.set(1, 0.7, 0.8);
    snout.position.set(1.82, 1.28, 0);
    bear.add(snout);

    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), noseMat);
    nose.position.set(2.04, 1.34, 0);
    bear.add(nose);

    [0.32, -0.32].forEach(z => {
      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), furMat);
      ear.position.set(1.15, 1.95, z);
      bear.add(ear);
    });

    [0.22, -0.22].forEach(z => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), noseMat);
      eye.position.set(1.68, 1.55, z);
      bear.add(eye);
    });

    const legGeo = new THREE.CylinderGeometry(0.2, 0.18, 0.9, 12);
    const legPositions = [
      [0.75, 0.5],   // front-left
      [0.75, -0.5],  // front-right
      [-0.75, 0.5],  // back-left
      [-0.75, -0.5]  // back-right
    ];
    const legs = legPositions.map(([x, z]) => {
      const pivot = new THREE.Group();
      pivot.position.set(x, 0.9, z);
      const leg = new THREE.Mesh(legGeo, furMat);
      leg.position.set(0, -0.45, 0);
      pivot.add(leg);
      bear.add(pivot);
      return pivot;
    });

    const tail = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), furMat);
    tail.position.set(-1.3, 1.15, 0);
    bear.add(tail);

    return { group: bear, legs, bodyMesh: body, headMesh: head };
  }

  const bear = buildBear();
  scene.add(bear.group);

  // walking bounds along X (approx viewport-relative width in world units)
  let bound = 6.5;
  let direction = 1; // 1 = walking right, -1 = walking left
  let baseScale = 0.55;
  let userYaw = 0;      // manual drag rotation offset
  let isDragging = false;
  let lastPointerX = 0;

  function updateBear3DScale(){
    const n = getWatchCount();
    baseScale = 0.55 + Math.min(n, 40) * 0.02; // grows, caps ~1.35
    bear.group.scale.setScalar(baseScale);
  }
  window.updateBear3DScale = updateBear3DScale;
  updateBear3DScale();

  bear.group.position.x = -bound * 0.6;
  bear.group.rotation.y = direction > 0 ? Math.PI / 2 : -Math.PI / 2;

  function onPointerDown(e){
    isDragging = true;
    lastPointerX = (e.touches ? e.touches[0].clientX : e.clientX);
  }
  function onPointerMove(e){
    if(!isDragging) return;
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const dx = x - lastPointerX;
    lastPointerX = x;
    userYaw += dx * 0.01;
  }
  function onPointerUp(){ isDragging = false; }

  renderer.domElement.addEventListener('mousedown', onPointerDown);
  renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: true });
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('touchmove', onPointerMove, { passive: true });
  window.addEventListener('mouseup', onPointerUp);
  window.addEventListener('touchend', onPointerUp);

  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    if(!isDragging){
      const speed = 0.9;
      bear.group.position.x += direction * speed * 0.016;
      if(bear.group.position.x > bound || bear.group.position.x < -bound){
        direction *= -1;
        bear.group.position.x = Math.max(-bound, Math.min(bound, bear.group.position.x));
      }
      const facing = direction > 0 ? Math.PI / 2 : -Math.PI / 2;
      bear.group.rotation.y = facing + userYaw;

      // leg swing + body bob while walking
      bear.legs.forEach((legPivot, i) => {
        const phase = (i % 2 === 0) ? 0 : Math.PI;
        legPivot.rotation.x = Math.sin(t * 6 + phase) * 0.5;
      });
      bear.group.position.y = Math.abs(Math.sin(t * 6)) * 0.06;
    } else {
      bear.group.rotation.y = (direction > 0 ? Math.PI / 2 : -Math.PI / 2) + userYaw;
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    W = stage.clientWidth; H = stage.clientHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
    bound = W / 150; // keep walk range proportional to screen width
  });
  // set initial bound based on width
  bound = Math.max(3, W / 150);
})();

(function initAIChatBot(){
  const btn = document.getElementById('aiChatBtn');
  const panel = document.getElementById('aiChatPanel');
  const closeBtn2 = document.getElementById('aiChatClose');
  const messagesEl = document.getElementById('aiChatMessages');
  const inputEl = document.getElementById('aiChatInput');
  const sendBtn = document.getElementById('aiChatSend');
  if(!btn || !panel) return;

  const seriesGroups = groupBySeries(videos);
  const catalogLines = seriesGroups.map(g =>
    `- ${g.series} (${g.episodes[0].genre}, ${g.episodes.length} episode${g.episodes.length>1?'s':''})`
  ).join('\n');
  const seriesLookup = new Map(seriesGroups.map(g => [g.series, g]));

  let history = [];

  function addMessage(role, text, recs){
    const div = document.createElement('div');
    div.className = 'ai-msg ' + (role === 'user' ? 'user' : 'bot');
    div.textContent = text;
    messagesEl.appendChild(div);
    if(recs && recs.length){
      const chipWrap = document.createElement('div');
      recs.forEach(name => {
        const chip = document.createElement('span');
        chip.className = 'ai-rec-chip';
        chip.textContent = '▶ ' + name;
        chip.addEventListener('click', () => {
          const g = seriesLookup.get(name);
          if(g) openSeries(g);
        });
        chipWrap.appendChild(chip);
      });
      messagesEl.appendChild(chipWrap);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function detectRecs(text){
    const found = [];
    seriesGroups.forEach(g => {
      if(text.includes(g.series) && !found.includes(g.series)) found.push(g.series);
    });
    return found;
  }

  btn.addEventListener('click', () => {
    panel.classList.toggle('open');
    if(panel.classList.contains('open') && !messagesEl.childElementCount){
      addMessage('bot', 'ආයුබෝවන්! 🎬 මම CINE FACTS LK එකේ AI Film Bot. genre එකක්, mood එකක්, නැත්නම් film නමක් කියලා අහන්න — site එකේ තියෙන දේවලින් suggest කරන්නම්.');
    }
  });
  closeBtn2.addEventListener('click', () => panel.classList.remove('open'));

  async function sendMessage(){
    const text = inputEl.value.trim();
    if(!text) return;
    addMessage('user', text);
    inputEl.value = '';
    history.push({ role: 'user', content: text });

    const typingDiv = document.createElement('div');
    typingDiv.className = 'ai-msg bot typing';
    typingDiv.textContent = 'ටයිප් කරමින්...';
    messagesEl.appendChild(typingDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    const systemPrompt = `ඔයා CINE FACTS LK කියන Sinhala movie/series streaming site එකේ හිතවත් සහ උපකාරි AI Film Bot කෙනා. ඔයාගේ වගකීම් දෙකයි:
1) User කෙනාට films/series recommend කරන එක — පහත catalog එකේ තියෙන series විතරක් recommend කරන්න. Catalog එකෙන් පිටින් films recommend කරන්න එපා.
2) Films/series/actors/general chit-chat ගැන කෙටියෙන්, හිතවත් විදිහට chat කරන්න.
Series නමක් recommend කරද්දී, catalog එකේ තියෙන විදිහටම exact series නම වාක්‍යයේ දාන්න (spelling වෙනස් කරන්න එපා), එතකොට site එකට watch button එකක් auto විදිහට පෙන්නන්න පුළුවන්.
උත්තර කෙටියෙන්, හිතවත්ව, Sinhala/Singlish මිශ්‍රව දෙන්න (user කතා කරන විදිහට adapt වෙන්න). Emoji ටිකක් පාවිච්චි කරන්න පුළුවන්.
කවුරු හරි CINE FACTS LK site එකේ අයිතිකරයා/developer/creator කවුද කියලා ඇහුවොත්, නම "GIHAN SANDANU" කියලා කියන්න.

Site එකේ තියෙන catalog එක:
${catalogLines}`;

    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: systemPrompt,
          messages: history
        })
      });
      const data = await response.json();
      const reply = (data.content || []).map(b => b.text || '').join('\n').trim() || 'සමාවෙන්න, දෝෂයක් ආවා. ආයෙත් try කරන්න.';
      typingDiv.remove();
      const recs = detectRecs(reply);
      addMessage('bot', reply, recs);
      history.push({ role: 'assistant', content: reply });
    }catch(err){
      typingDiv.remove();
      addMessage('bot', 'සමාවෙන්න, connection එකේ ප්‍රශ්නයක්. ආයෙත් try කරන්න. 🙏');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });
})();

/* 70 subs promo popup */
(function initPromoPopup(){
  const overlay = document.getElementById('promoOverlay');
  const closeBtn3 = document.getElementById('promoClose');
  if(!overlay) return;
  const KEY = 'cfl_promo_70subs_closed';
  if(!localStorage.getItem(KEY)){
    setTimeout(() => overlay.classList.add('open'), 400);
  }
  function closePromo(){
    overlay.classList.remove('open');
    localStorage.setItem(KEY, '1');
  }
  closeBtn3.addEventListener('click', closePromo);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closePromo(); });
})();
